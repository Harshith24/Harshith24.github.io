<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harshith | Terminal Resume</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0a0a0a; color: #ceb888; font-family: 'Courier New', Courier, monospace; overflow-x: hidden; }
        .terminal-window {
            background: rgba(15, 15, 15, 0.98);
            border: 1px solid #ceb888;
            box-shadow: 0 0 30px rgba(206, 184, 136, 0.15);
        }
        input { background: transparent; border: none; outline: none; color: #fff; width: 100%; font-family: inherit; }
        .output-text { color: #e5e7eb; margin-bottom: 12px; line-height: 1.5; }
        .command-color { color: #ceb888; font-weight: bold; }
        .gold-label { color: #ceb888; font-weight: bold; border-bottom: 1px solid #ceb888; }
        .link-gold { color: #ceb888; text-decoration: underline; transition: 0.3s; padding: 2px 4px; }
        .link-gold:hover { background: #ceb888; color: #000; text-decoration: none; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #ceb888; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-end mb-6 gap-4">
            <div>
                <h1 class="text-3xl font-bold uppercase tracking-tighter gold-gradient">Harshith_Suresh.exe</h1>
                <p class="text-xs text-gray-500 mt-1">Purdue University | Computer Science '26</p>
            </div>
            <div class="flex flex-wrap gap-4 text-sm">
                <a href="https://github.com/Harshith24" target="_blank" class="link-gold"><i class="fab fa-github"></i> GitHub</a>
                <a href="https://linkedin.com/in/harshith-suresh-056079216/" target="_blank" class="link-gold"><i class="fab fa-linkedin"></i> LinkedIn</a>
                <a href="Harshith_Suresh_Resume.pdf" target="_blank" class="link-gold"><i class="fas fa-file-pdf"></i> PDF_Resume</a>
            </div>
        </div>

        <div class="terminal-window rounded-lg overflow-hidden">
            <div class="bg-[#222] px-4 py-2 flex items-center justify-between">
                <div class="flex gap-2">
                    <div class="w-3 h-3 rounded-full bg-red-500"></div>
                    <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                    <div class="w-3 h-3 rounded-full bg-green-500"></div>
                </div>
                <span class="text-[10px] uppercase tracking-widest text-gray-400">Secure Shell Access</span>
            </div>
            
            <div id="terminal-body" class="p-6 h-[650px] overflow-y-auto text-sm md:text-base">
                <div class="output-text text-[#ceb888]">System initialized. Welcome, Recruiter.</div>
                <div class="output-text">Type <span class="command-color">'help'</span> to see a list of commands.</div>
                <div id="history"></div>
                
                <div class="flex gap-2 mt-2">
                    <span class="command-color">visitor@purdue:~$</span>
                    <input type="text" id="command-input" autofocus autocomplete="off" spellcheck="false">
                </div>
            </div>
        </div>
    </div>

    <script>
        const input = document.getElementById('command-input');
        const history = document.getElementById('history');
        const terminalBody = document.getElementById('terminal-body');

        const commands = {
            help: `Available commands:
                <br>  - <span class='command-color'>experience</span> : Comprehensive work history
                <br>  - <span class='command-color'>projects</span>   : Technical project deep-dive
                <br>  - <span class='command-color'>skills --[arg]</span> : Usage: <span class='italic text-gray-400'>skills --languages</span>, <span class='italic text-gray-400'>--technology</span>, or <span class='italic text-gray-400'>--certifications</span>
                <br>  - <span class='command-color'>courses</span>    : Relevant Purdue coursework
                <br>  - <span class='command-color'>contact</span>    : Official email address
                <br>  - <span class='command-color'>clear</span>      : Clear session history`,
            
            contact: "Email: <a href='mailto:harshiths2004@gmail.com' class='link-gold'>harshiths2004@gmail.com</a> ",
            
            courses: "Data Structures, Algorithms, Cybersecurity and Networks, Operating Systems [cite: 7]<br>Minors: Applications In Data Science, Entrepreneurship and Innovation [cite: 8]",

            experience: `
                <br><span class="gold-label">Tesla Inc. | Software Engineering Intern</span> (Aug 2025 - Dec 2025) [cite: 11, 15]
                <br>• Built real-time network topology and traceroute simulations to visualize device connections and metrics, reducing debug time 2x[cite: 16].
                <br>• Architected text-to-query pipeline with LangGraph and fine-tuned SLM (LoRA) for ClickHouse and PostgreSQL[cite: 17].
                <br>• Developed network audit tool for 100K+ devices, reducing audit time from hours to seconds[cite: 18].
                <br>• Enhanced network scraper for routing tables, VLANs, and BGP peers across global network[cite: 19].
                <br>• Automated tasks including password rotation, config updates, and ZTP[cite: 20].

                <br><br><span class="gold-label">Crowe LLP | Cybersecurity Consultant Intern</span> (June 2025 - Aug 2025) [cite: 21, 22]
                <br>• Performed assessments and HITRUST compliance reviews for public sector clients[cite: 23].
                <br>• Reviewed Active Directory, Entra ID, network architecture, and incident management[cite: 23].
                <br>• Conducted pen-testing using Nmap, Nessus, Metasploit, and Wireshark[cite: 24].
                <br>• Automated VM deployment using Ansible, Packer, and Bash[cite: 25].

                <br><br><span class="gold-label">Mechasense.io | Software Engineering Intern</span> (Dec 2024 - April 2025) [cite: 26, 28]
                <br>• Automated high-availability AWS deployment through Jenkins[cite: 29].
                <br>• Implemented ML models (KNN, XGBoost, Neural Networks); achieved 90% accuracy on HVAC failure detection[cite: 30, 31].
                <br>• Built synthetic data generation scripts for robust model training[cite: 32].

                <br><br><span class="gold-label">Munich Re | Security Engineering Intern</span> (June 2024 - Aug 2024) [cite: 33, 34]
                <br>• Developed Malware Scanning pipeline on Azure using Defender for Cloud and Datadog[cite: 35].
                <br>• Configured IAM policies, security group rules, and subnets to prevent unauthorized access[cite: 36].
                <br>• Deployed infrastructure (Private Endpoints, Storage) via Terraform[cite: 37].`,

            projects: `
                <br><span class="gold-label">Lecture Study Assistant</span> [cite: 45]
                <br>• Local Video RAG system using EasyOCR, Whisper (transcription), and PGvector (embeddings)[cite: 47, 48].
                <br>• Integrated Mistral LLM and Nomic Embedding model with FastAPI and Next.js[cite: 49].

                <br><br><span class="gold-label">Library Management Project</span> [cite: 50]
                <br>• Python, Flask, React, and SQLAlchemy web app[cite: 53].
                <br>• Deployed on GCP App Engine with Nginx/Gunicorn for scalable request handling[cite: 53].
                <br>• Optimized via normalization and serializable concurrency for conflict-free borrowing[cite: 53].`
        };

        const skillsData = {
            "--languages": "Python, Java, Typescript, C, SQL, PromQL [cite: 54]",
            "--technology": "Terraform, AWS, Azure, GCP, Docker, Kubernetes, Ansible, RAG, LangChain, Linux, CI/CD, Network Protocols, Next.js, React [cite: 54]",
            "--certifications": "AWS Solutions Architect Associate [cite: 6]"
        };

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const rawInput = input.value.trim().toLowerCase();
                const [cmd, arg] = rawInput.split(' ');
                
                const line = document.createElement('div');
                line.innerHTML = `<span class="command-color">visitor@purdue:~$</span> ${input.value}`;
                history.appendChild(line);

                const result = document.createElement('div');
                result.className = 'output-text mt-1 mb-4';

                if (cmd === 'clear') {
                    history.innerHTML = '';
                } else if (cmd === 'skills') {
                    if (skillsData[arg]) {
                        result.innerHTML = `<span class='command-color'>Skills [${arg.replace('--','')}]:</span><br>${skillsData[arg]}`;
                    } else {
                        result.innerHTML = "Usage: skills --languages | skills --technology | skills --certifications";
                    }
                    history.appendChild(result);
                } else if (commands[cmd]) {
                    result.innerHTML = commands[cmd];
                    history.appendChild(result);
                } else if (rawInput !== "") {
                    result.innerHTML = `Command not found: ${cmd}. Type 'help' for options.`;
                    history.appendChild(result);
                }

                input.value = '';
                terminalBody.scrollTop = terminalBody.scrollHeight;
            }
        });
    </script>
</body>
</html>
